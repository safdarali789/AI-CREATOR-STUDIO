# GitHub Actions Workflow
# File location: .github/workflows/build-and-test.yml
# یہ file automatically run ہوگی ہر push/PR پر

name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      # Step 1: Code checkout کریں
      - uses: actions/checkout@v4

      # Step 2: Node.js setup
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Step 3: Dependencies install کریں
      - name: Install dependencies
        run: npm ci

      # Step 4: TypeScript linting
      - name: Run TypeScript checks
        run: npm run lint

      # Step 5: Build کریں
      - name: Build production
        run: npm run build

      # Step 6: Build artifacts upload
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist/

  # Optional: Security scanning
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run security audit
        run: npm audit --audit-level=moderate

  # Optional: Code quality
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
      - run: npm ci
      - name: Check code formatting
        run: npm run lint

---

# Deployment Workflow (Optional)
# File location: .github/workflows/deploy.yml

name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Option 1: Deploy to Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      # Option 2: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

---

# Auto Release (Optional)
# Automatically create releases based on tags

name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Changes in this Release:
            - See CHANGELOG.md for details
          draft: false
          prerelease: false

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/
          asset_name: ai-photo-studio-${{ github.ref }}.zip
          asset_content_type: application/zip

---

# Secrets Setup Guide
# GitHub repo میں یہ secrets add کریں:
# 
# 1. Settings → Secrets and variables → Actions
# 
# Required secrets:
# - VERCEL_TOKEN (from https://vercel.com/account/tokens)
# - VERCEL_ORG_ID (from Vercel dashboard)
# - VERCEL_PROJECT_ID (from project settings)
# - GITHUB_TOKEN (auto-generated)
#
# Optional secrets:
# - GEMINI_API_KEY (if needed in build)
# - SLACK_WEBHOOK (for notifications)

